version: 1.0.0
sources:
  - name: user_age
    dtype: float
    default_val: "0"
  - name: item_category
    dtype: string
    default_val: unknown
  - name: user_tags
    dtype: string
    default_val: ""
  - name: item_tags
    dtype: string
    default_val: ""
  - name: session_id
    dtype: string
    default_val: unknown
  - name: json_tags_src
    dtype: string
    default_val: ""
  - name: split_src
    dtype: string
    default_val: ""
  - name: expr_v0
    dtype: float
    default_val: "0.0"
  - name: expr_v1
    dtype: float
    default_val: "0.0"
  - name: seq_src
    dtype:
      list:
        dtype: int
        length: 3
    default_val: "0"
  - name: concat_src1
    dtype: string
    default_val: ""
  - name: concat_src2
    dtype: string
    default_val: ""
operators:
  - name: age_bucket_op
    op_type: Bucketing
    inputs: [user_age]
    outputs: [age_bucket]
    params:
      boundaries: [18.0, 25.0, 35.0]
    embed:
      vocab_size: 5
      embed_dim: 4
  - name: category_map_op
    op_type: DictMapper
    inputs: [item_category]
    outputs: [category_idx]
    params:
      default_idx: 0
      mapping:
        electronics: 1
        books: 2
    embed:
      vocab_size: 3
      embed_dim: 4
  - name: user_tag_parse_op
    op_type: StringParser
    inputs: [user_tags]
    outputs: [user_tag_keys]
    params:
      sep1: "#"
      sep2: "|"
      key_index: 0
      pad_len: 3
      pad_val: unknown
  - name: item_tag_parse_op
    op_type: StringParser
    inputs: [item_tags]
    outputs: [item_tag_keys]
    params:
      sep1: "#"
      sep2: "|"
      key_index: 0
      pad_len: 2
      pad_val: unknown
  - name: user_tag_map_op
    op_type: DictMapper
    inputs: [user_tag_keys]
    outputs: [user_tag_idx]
    params:
      default_idx: 0
      mapping:
        sports: 1
        gaming: 2
        music: 3
    embed:
      vocab_size: 4
      embed_dim: 4
      pooling: mean
  - name: tag_overlap_op
    op_type: ListOverlap
    inputs: [user_tag_keys, item_tag_keys]
    outputs: [tag_overlap]
  - name: tag_cross_op
    op_type: CrossFeature
    inputs: [user_tag_keys, item_tag_keys]
    outputs: [tag_cross]
    params:
      cross_type: cartesian
  - name: tag_cross_hash_op
    op_type: FeatureHash
    inputs: [tag_cross]
    outputs: [tag_cross_idx]
    params:
      vocab_size: 128
      num_hashes: 1
    embed:
      vocab_size: 128
      embed_dim: 4
      pooling: mean
  - name: session_hash_op
    op_type: FeatureHash
    inputs: [session_id]
    outputs: [session_idx]
    params:
      vocab_size: 64
      num_hashes: 1
    embed:
      vocab_size: 64
      embed_dim: 4
  - name: json_tag_extract_op
    op_type: JsonExtractList
    inputs: [json_tags_src]
    outputs: [json_tags]
    params:
      key: tag
      pad_len: 3
      pad_val: none
  - name: list_string_parse_op
    op_type: ListStringParser
    inputs: [json_tags]
    outputs: [list_parsed]
    params:
      sep: ":"
      key_index: 0
  - name: split_op
    op_type: Split
    inputs: [split_src]
    outputs: [split_list]
    params:
      sep: "|"
      max_len: 2
      pad_val: unknown
  - name: flat_split_op
    op_type: FlatSplit
    inputs: [split_list]
    outputs: [flat_split_list]
    params:
      sep: ","
      max_len: 4
      pad_val: pad
  - name: expr_op
    op_type: ExpressionOp
    inputs: [expr_v0, expr_v1]
    outputs: [expr_out]
    params:
      script: v0 * v1 + log(v0 + 1.0)
  - name: seq_op
    op_type: SequenceOp
    inputs: [seq_src]
    outputs: [seq_out]
    params:
      max_len: 3
      pad_val: -1
  - name: concat_op
    op_type: StringConcat
    inputs: [concat_src1, concat_src2]
    outputs: [concat_out]
    params:
      separator: "-"
