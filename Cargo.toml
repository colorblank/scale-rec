[workspace]
members = ["crates/core"]
exclude = ["python/rust_feat", "python/rust_feat_bridge"]
resolver = "2"

[package]
name = "scale-rec"
version = "0.1.0"
edition = "2021"

[dependencies]
scale-rec-core = { path = "crates/core" }
candle-core = "0.10.2"
candle-nn = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
petgraph = "0.6"
rhai = { version = "1.19", features = ["sync"] }
libloading = "0.8"
tracing = "0.1"
anyhow = "1.0"
csv = "1.3"

# HTTP server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["cors", "timeout"] }
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# benchmark
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rayon = "1.10"

[features]
default = []
cpu-mkl = ["candle-core/mkl", "candle-nn/mkl"]
macos-accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
macos-metal = ["candle-core/metal", "candle-nn/metal"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
