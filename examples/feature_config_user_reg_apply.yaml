- name: install_app_goal_hash
  op_type: FeatureHash
  inputs: [install_app_goal]
  outputs: [install_app_goal_idx]
  params:
    vocab_size: 128
    num_hashes: 1
  embed:
    vocab_size: 128
    embed_dim: 8
- name: hour_hash
  op_type: FeatureHash
  inputs: [hour]
