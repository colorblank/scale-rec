- name: model_hash
  op_type: FeatureHash
  inputs: [model]
  outputs: [model_idx]
  params:
    vocab_size: 2048
    num_hashes: 1
  embed:
    vocab_size: 2048
    embed_dim: 8
- name: price_bucket
  op_type: Bucketing
  inputs: [price]
  outputs: [price_bucket_idx]
  params:
    boundaries: [1000, 3000, 5000, 8000, 12000, 20000, 30000, 50000]
  embed:
    vocab_size: 9
    embed_dim: 8
- name: channel_id_hash
  op_type: FeatureHash
  inputs: [channel_id]
