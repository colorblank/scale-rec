    num_hashes: 1
  embed:
    vocab_size: 1024
    embed_dim: 8
- name: prov_name_hash
  op_type: FeatureHash
  inputs: [prov_name]
  outputs: [prov_name_idx]
  params:
    vocab_size: 64
    num_hashes: 1
  embed:
    vocab_size: 64
    embed_dim: 8
- name: city_name_hash
  op_type: FeatureHash
  inputs: [city_name]
  outputs: [city_name_idx]
