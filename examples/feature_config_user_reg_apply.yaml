operators:
- name: user_id_hash
  op_type: FeatureHash
  inputs: [user_id]
  outputs: [user_id_idx]
  params:
    vocab_size: 200000
    num_hashes: 1
  embed:
    vocab_size: 200000
    embed_dim: 16
- name: user_type_hash
  op_type: FeatureHash
  inputs: [user_type]
  outputs: [user_type_idx]
  params:
    vocab_size: 16
    num_hashes: 1
  embed:
    vocab_size: 16
    embed_dim: 4
- name: is_new_user_hash
  op_type: FeatureHash
  inputs: [is_new_user]
  outputs: [is_new_user_idx]
  params:
    vocab_size: 8
    num_hashes: 1
  embed:
    vocab_size: 8
    embed_dim: 4
- name: new_start_date_hash
  op_type: FeatureHash
  inputs: [new_start_date]
  outputs: [new_start_date_idx]
  params:
    vocab_size: 512
    num_hashes: 1
  embed:
    vocab_size: 512
    embed_dim: 8
- name: create_time_hash
  op_type: FeatureHash
  inputs: [create_time]
  outputs: [create_time_idx]
