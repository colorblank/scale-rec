operators:
- name: item_type_map
  op_type: DictMapper
  inputs:
  - item_type
  outputs:
  - item_type_idx
  params:
    mapping:
      state: 1
      ask_answer: 2
      iwc_dialogue: 3
      news: 4
      report: 5
      snslivepost: 6
      snsview: 7
    default_idx: 0
  embed:
    vocab_size: 8
    embed_dim: 4
- name: source_name_map
  op_type: DictMapper
  inputs:
  - source_name
  outputs:
  - source_name_idx
  params:
    mapping:
      社区: 1
      同花顺: 2
      东方财富: 3
      雪球: 4
    default_idx: 0
  embed:
    vocab_size: 5
    embed_dim: 4
- name: quality_score_bucket
  op_type: Bucketing
  inputs:
  - quality_score_label
  outputs:
  - quality_score_bucket
  params:
    boundaries:
    - 0.2
    - 0.4
    - 0.6
    - 0.8
  embed:
    vocab_size: 5
    embed_dim: 4
- name: quality_score_log
  op_type: ExpressionOp
  inputs:
  - quality_score_label
  outputs:
  - quality_score_log
  params:
    script: log(v0 + 0.01)
- name: quality_score_log_bucket
  op_type: Bucketing
  inputs:
  - quality_score_log
  outputs:
  - quality_score_log_bucket
  params:
    boundaries:
    - -4.0
    - -2.0
    - -1.0
    - 0.0
  embed:
    vocab_size: 5
    embed_dim: 4
