type: din
item_vocab_size: 10000
embed_dim: 16
activation_hidden_dims: [64, 32]
mlp_hidden_dims: [128, 64]
behavior_feature: hist_item_ids
candidate_feature: item_id
output_contract:
  version: 1
  graph:
    towers:
      - name: pred_logit
        input: shared
        kind: binary_logit
        hidden_dims: []
        activation: none
    relations:
      - name: pred_prob
        op: sigmoid
        inputs: [pred_logit]
  objectives:
    - name: pred_loss
      source: pred_logit
      label: is_click
      loss:
        type: binary_cross_entropy_with_logits
  metrics:
    - name: pred_auc
      source: pred_logit
      label: is_click
      type: auc
    - name: pred_logloss
      source: pred_prob
      label: is_click
      type: logloss
  outputs:
    - name: pred
      source: pred_prob
