# OneRank: Unified Transformer-Native Ranking Architecture — KDD 2026
# Paper: arXiv:2606.16838
#
# 3-task Click / CVR / Detail with cascade masking
# -------------------------------------------------------------------
type: onerank
d: 128
d_ff: 512
num_layers: 2
n_heads: 8
num_tasks: 3
cross_task_mask: cascade
output_contract:
  version: 1
  graph:
    towers:
      - {name: click_logit,  kind: binary_logit, hidden_dims: [4]}
      - {name: cvr_logit,    kind: binary_logit, hidden_dims: [4]}
      - {name: detail_logit, kind: binary_logit, hidden_dims: [4]}
    relations:
      - {name: click_prob,  op: sigmoid, inputs: [click_logit]}
      - {name: cvr_prob,    op: sigmoid, inputs: [cvr_logit]}
      - {name: detail_prob, op: sigmoid, inputs: [detail_logit]}
  objectives:
    - name: click_loss
      source: click_logit
      label: is_click
      loss: {type: binary_cross_entropy_with_logits}
    - name: cvr_loss
      source: cvr_logit
      label: is_cvr
      loss: {type: binary_cross_entropy_with_logits}
    - name: detail_loss
      source: detail_logit
      label: is_click_detail
      loss: {type: binary_cross_entropy_with_logits}
  metrics:
    - name: click_auc
      source: click_logit
      label: is_click
      type: auc
    - name: cvr_auc
      source: cvr_logit
      label: is_cvr
      type: auc
    - name: detail_auc
      source: detail_logit
      label: is_click_detail
      type: auc
  outputs:
    - {name: click,  source: click_prob}
    - {name: cvr,    source: cvr_prob}
    - {name: detail, source: detail_prob}
