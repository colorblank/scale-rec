# MixFormer: Co-Scaling Up Dense and Sequence in Industrial Recommenders — KDD 2026
# Paper: arXiv:2602.14110
#
# MixFormer config (N=16, D=384, L=4)
# NOTE: D must be divisible by N for head_mixing; paper's D=386 is adjusted to 384.
# -------------------------------------------------------------------
type: mixformer
d: 384
d_ff: 1024
num_heads: 16
num_layers: 4
output_contract:
  version: 1
  graph:
    towers:
      - name: click_logit
        kind: binary_logit
        hidden_dims: [4]
      - name: cvr_logit
        kind: binary_logit
        hidden_dims: [4]
    relations:
      - name: click_prob
        op: sigmoid
        inputs: [click_logit]
      - name: cvr_prob
        op: sigmoid
        inputs: [cvr_logit]
  objectives:
    - name: click_loss
      source: click_logit
      label: is_click
      loss: {type: binary_cross_entropy_with_logits}
    - name: cvr_loss
      source: cvr_logit
      label: is_cvr
      loss: {type: binary_cross_entropy_with_logits}
  metrics:
    - name: click_auc
      source: click_logit
      label: is_click
      type: auc
    - name: cvr_auc
      source: cvr_logit
      label: is_cvr
      type: auc
  outputs:
    - name: click
      source: click_prob
    - name: cvr
      source: cvr_prob
