version: 1.0.0
sources:
  # 1-3: 基础标识
  - name: user_id
    source: User
    dtype: int
    default_val: "0"
  - name: item_id
    source: Item
    dtype: string
    default_val: ""
  - name: rec_algo
    source: Context
    dtype: string
    default_val: unknown
  # 4-8: 标签列 (role=label, 不进入 DAG)
  - name: is_click
    dtype: int
    default_val: "0"
    role: label
  - name: is_cvr
    dtype: int
    default_val: "0"
    role: label
  - name: is_click_detail
    dtype: int
    default_val: "0"
    role: label
  - name: is_click_stock
    dtype: int
    default_val: "0"
    role: label
  - name: stay_time
    dtype: int
    default_val: "-1"
    role: label
  # 9: 日期分区（仅标识数据日期，丢弃）
  - name: p_date
    dtype: string
    default_val: "20260331"
    role: discard
  # 10-19: User 标签特征
  - name: fav_securities
    source: User
    dtype: string
    default_val: ""
  - name: recent_stocks
    source: User
    dtype: string
    default_val: ""
  - name: interest_keywords
    source: User
    dtype: string
    default_val: ""
  - name: follow_authors
    source: User
    dtype: string
    default_val: ""
  - name: is_new_user
    source: User
    dtype: string
    default_val: 老用户
  - name: hold_stocks
    source: User
    dtype: string
    default_val: ""
  - name: hist_hold_stocks
    source: User
    dtype: string
    default_val: ""
  - name: historical_click_items
    source: User
    dtype: string
    default_val: ""
  - name: asset_level
    source: User
    dtype: string
    default_val: 未知
  - name: last_login_date
    source: User
    dtype: string
    default_val: ""
  # 20-25: User 画像特征
  - name: city
    source: User
    dtype: string
    default_val: 未知
  - name: investment_horizon
    source: User
    dtype: string
    default_val: ""
  - name: invest_style
    source: User
    dtype: string
    default_val: ""
  - name: theme_interest
    source: User
    dtype: string
    default_val: ""
  - name: industry_interest
    source: User
    dtype: string
    default_val: ""
  - name: fund_favorites
    source: User
    dtype: string
    default_val: ""
  # 26: 内容类型
  - name: item_type
    source: Item
    dtype: string
    default_val: unknown
  # 27-32: Item 标签特征
  - name: roleneeds_first_label
    source: Item
    dtype: string
    default_val: "[]"
  - name: roleneeds_second_label
    source: Item
    dtype: string
    default_val: "[]"
  - name: invest_label
    source: Item
    dtype: string
    default_val: "[]"
  - name: invest_label_second
    source: Item
    dtype: string
    default_val: "[]"
  - name: invest_label_third
    source: Item
    dtype: string
    default_val: "[]"
  - name: quality_score_label
    source: Item
    dtype: float
    default_val: "0.0"
  # 33-39: Item 关联特征
  - name: stock_list
    source: Item
    dtype: string
    default_val: "[]"
  - name: entity_words_label
    source: Item
    dtype: string
    default_val: "[]"
  - name: item_entities_v3
    source: Item
    dtype: string
    default_val: "[]"
  - name: author_id
    source: Item
    dtype: int
    default_val: "0"
  - name: author
    source: Item
    dtype: string
    default_val: ""
  - name: source_name
    source: Item
    dtype: string
    default_val: unknown
  - name: emb_id
    source: Item
    dtype: string
    default_val: "[]"
  # 40-43: 新增 Item 属性
  - name: wordnum
    source: Item
    dtype: int
    default_val: "0"
  - name: answerscore
    source: Item
    dtype: int
    default_val: "0"
    role: discard
  - name: has_picture
    source: Item
    dtype: string
    default_val: "0"
  - name: has_video
    source: Item
    dtype: string
    default_val: "0"
operators:
  # ── ID 哈希 ──
  - name: item_id_hash
    op_type: FeatureHash
    inputs:
      - item_id
    outputs:
      - item_id_idx
    params:
      vocab_size: 50000
      num_hashes: 1
    embed:
      vocab_size: 50000
      embed_dim: 8
  - name: user_id_hash
    op_type: FeatureHash
    inputs:
      - user_id
    outputs:
      - user_id_idx
    params:
      vocab_size: 50000
      num_hashes: 1
    embed:
      vocab_size: 50000
      embed_dim: 8
  - name: rec_algo_hash
    op_type: FeatureHash
    inputs:
      - rec_algo
    outputs:
      - rec_algo_idx
    params:
      vocab_size: 20
      num_hashes: 1
    embed:
      vocab_size: 20
      embed_dim: 8
  - name: item_type_hash
    op_type: FeatureHash
    inputs:
      - item_type
    outputs:
      - item_type_idx
    params:
      vocab_size: 20
      num_hashes: 1
    embed:
      vocab_size: 20
      embed_dim: 8
  - name: source_name_hash
    op_type: FeatureHash
    inputs:
      - source_name
    outputs:
      - source_name_idx
    params:
      vocab_size: 20
      num_hashes: 1
    embed:
      vocab_size: 20
      embed_dim: 8
  - name: is_new_user_hash
    op_type: FeatureHash
    inputs:
      - is_new_user
    outputs:
      - is_new_user_idx
    params:
      vocab_size: 10
      num_hashes: 1
    embed:
      vocab_size: 10
      embed_dim: 8
  - name: asset_level_hash
    op_type: FeatureHash
    inputs:
      - asset_level
    outputs:
      - asset_level_idx
    params:
      vocab_size: 20
      num_hashes: 1
    embed:
      vocab_size: 20
      embed_dim: 8
  - name: city_hash
    op_type: FeatureHash
    inputs:
      - city
    outputs:
      - city_idx
    params:
      vocab_size: 500
      num_hashes: 1
    embed:
      vocab_size: 500
      embed_dim: 8
  - name: investment_horizon_hash
    op_type: FeatureHash
    inputs:
      - investment_horizon
    outputs:
      - investment_horizon_idx
    params:
      vocab_size: 20
      num_hashes: 1
    embed:
      vocab_size: 20
      embed_dim: 8
  - name: last_login_date_hash
    op_type: FeatureHash
    inputs:
      - last_login_date
    outputs:
      - last_login_date_idx
    params:
      vocab_size: 1000
      num_hashes: 1
    embed:
      vocab_size: 1000
      embed_dim: 8

  - name: author_id_hash
    op_type: FeatureHash
    inputs:
      - author_id
    outputs:
      - author_id_idx
    params:
      vocab_size: 10000
      num_hashes: 1
    embed:
      vocab_size: 10000
      embed_dim: 8
  - name: author_hash
    op_type: FeatureHash
    inputs:
      - author
    outputs:
      - author_idx
    params:
      vocab_size: 10000
      num_hashes: 1
    embed:
      vocab_size: 10000
      embed_dim: 8
  # ── 新增简单哈希 ──
  - name: wordnum_log
    op_type: ExpressionOp
    inputs:
      - wordnum
    outputs:
      - wordnum_log
    params:
      script: log(v0 + 1)
  - name: wordnum_bucket
    op_type: Bucketing
    inputs:
      - wordnum_log
    outputs:
      - wordnum_bucket
    params:
      boundaries:
        - 4.0
        - 5.0
        - 6.0
        - 7.0
  - name: wordnum_hash
    op_type: FeatureHash
    inputs:
      - wordnum_bucket
    outputs:
      - wordnum_idx
    params:
      vocab_size: 10
      num_hashes: 1
    embed:
      vocab_size: 10
      embed_dim: 8
  - name: has_picture_hash
    op_type: FeatureHash
    inputs:
      - has_picture
    outputs:
      - has_picture_idx
    params:
      vocab_size: 4
      num_hashes: 1
    embed:
      vocab_size: 4
      embed_dim: 8
  - name: has_video_hash
    op_type: FeatureHash
    inputs:
      - has_video
    outputs:
      - has_video_idx
    params:
      vocab_size: 4
      num_hashes: 1
    embed:
      vocab_size: 4
      embed_dim: 8
  # ── 数值分桶 ──
  - name: quality_score_bucket
    op_type: Bucketing
    inputs:
      - quality_score_label
    outputs:
      - quality_score_bucket
    params:
      boundaries:
        - 0.2
        - 0.4
        - 0.6
        - 0.8
    vocab_size: 5
    embed_dim: 8
    embed:
      vocab_size: 5
      embed_dim: 8
  - name: quality_score_log
    op_type: ExpressionOp
    inputs:
      - quality_score_label
    outputs:
      - quality_score_log
    params:
      script: log(v0 + 0.01)
  - name: quality_score_log_bucket
    op_type: Bucketing
    inputs:
      - quality_score_log
    outputs:
      - quality_score_log_bucket
    params:
      boundaries:
        - -4.0
        - -2.0
        - -1.0
        - 0.0
    vocab_size: 5
    embed_dim: 8
    embed:
      vocab_size: 5
      embed_dim: 8
  # ── JSON 解析 + 哈希链 ──
  - name: roleneeds_first_parse
    op_type: JsonExtractList
    inputs:
      - roleneeds_first_label
    outputs:
      - roleneeds_first_tags
    params:
      key: tag
      pad_len: 3
      pad_val: ""
  - name: roleneeds_first_hash
    op_type: FeatureHash
    inputs:
      - roleneeds_first_tags
    outputs:
      - roleneeds_first_ids
    params:
      vocab_size: 100
      num_hashes: 1
    embed:
      vocab_size: 100
      embed_dim: 8
      pooling: flatten
      seq_len: 3
  - name: roleneeds_second_parse
    op_type: JsonExtractList
    inputs:
      - roleneeds_second_label
    outputs:
      - roleneeds_second_tags
    params:
      key: tag
      pad_len: 3
      pad_val: ""
  - name: roleneeds_second_hash
    op_type: FeatureHash
    inputs:
      - roleneeds_second_tags
    outputs:
      - roleneeds_second_ids
    params:
      vocab_size: 100
      num_hashes: 1
    embed:
      vocab_size: 100
      embed_dim: 8
      pooling: flatten
      seq_len: 3
  - name: invest_label_parse
    op_type: JsonExtractList
    inputs:
      - invest_label
    outputs:
      - invest_label_tags
    params:
      key: tag
      pad_len: 3
      pad_val: ""
  - name: invest_label_hash
    op_type: FeatureHash
    inputs:
      - invest_label_tags
    outputs:
      - invest_label_ids
    params:
      vocab_size: 100
      num_hashes: 1
    embed:
      vocab_size: 100
      embed_dim: 8
      pooling: flatten
      seq_len: 3
  - name: invest_label_second_parse
    op_type: JsonExtractList
    inputs:
      - invest_label_second
    outputs:
      - invest_label_second_tags
    params:
      key: tag
      pad_len: 3
      pad_val: ""
  - name: invest_label_second_hash
    op_type: FeatureHash
    inputs:
      - invest_label_second_tags
    outputs:
      - invest_label_second_ids
    params:
      vocab_size: 100
      num_hashes: 1
    embed:
      vocab_size: 100
      embed_dim: 8
      pooling: flatten
      seq_len: 3
  - name: invest_label_third_parse
    op_type: JsonExtractList
    inputs:
      - invest_label_third
    outputs:
      - invest_label_third_tags
    params:
      key: tag
      pad_len: 3
      pad_val: ""
  - name: invest_label_third_hash
    op_type: FeatureHash
    inputs:
      - invest_label_third_tags
    outputs:
      - invest_label_third_ids
    params:
      vocab_size: 100
      num_hashes: 1
    embed:
      vocab_size: 100
      embed_dim: 8
      pooling: flatten
      seq_len: 3
  - name: entity_words_parse
    op_type: JsonExtractList
    inputs:
      - entity_words_label
    outputs:
      - entity_words_tags
    params:
      key: tag
      pad_len: 5
      pad_val: ""
  - name: entity_words_hash
    op_type: FeatureHash
    inputs:
      - entity_words_tags
    outputs:
      - entity_words_ids
    params:
      vocab_size: 500
      num_hashes: 1
    embed:
      vocab_size: 500
      embed_dim: 8
      pooling: flatten
      seq_len: 5
  - name: entities_v3_parse
    op_type: JsonExtractList
    inputs:
      - item_entities_v3
    outputs:
      - entities_v3_list
    params:
      key: null
      pad_len: 4
      pad_val: ""
  - name: entities_v3_hash
    op_type: FeatureHash
    inputs:
      - entities_v3_list
    outputs:
      - entities_v3_ids
    params:
      vocab_size: 2000
      num_hashes: 1
    embed:
      vocab_size: 2000
      embed_dim: 8
      pooling: flatten
      seq_len: 4
  - name: emb_id_parse
    op_type: JsonExtractList
    inputs:
      - emb_id
    outputs:
      - emb_id_list
    params:
      key: null
      pad_len: 4
      pad_val: ""
  - name: emb_id_hash
    op_type: FeatureHash
    inputs:
      - emb_id_list
    outputs:
      - emb_id_ids
    params:
      vocab_size: 2000
      num_hashes: 1
    embed:
      vocab_size: 2000
      embed_dim: 8
      pooling: flatten
      seq_len: 4
  - name: stock_list_parse
    op_type: JsonExtractList
    inputs:
      - stock_list
    outputs:
      - stock_list_raw
    params:
      key: null
      pad_len: 5
      pad_val: ""
  - name: stock_code_extract
    op_type: ListStringParser
    inputs:
      - stock_list_raw
    outputs:
      - stock_codes
    params:
      sep: ","
      key_index: 0
  - name: stock_code_hash
    op_type: FeatureHash
    inputs:
      - stock_codes
    outputs:
      - stock_code_ids
    params:
      vocab_size: 1000
      num_hashes: 1
    embed:
      vocab_size: 1000
      embed_dim: 8
      pooling: flatten
      seq_len: 5
  # ── StringParser 链 (User) ──
  - name: fav_stock_parse
    op_type: StringParser
    inputs:
      - fav_securities
    outputs:
      - fav_stock_raw
    params:
      sep1: "|"
      sep2: "#"
      key_index: 0
      pad_len: 8
      pad_val: ""
  - name: fav_stock_code_extract
    op_type: ListStringParser
    inputs:
      - fav_stock_raw
    outputs:
      - fav_stock_codes
    params:
      sep: ","
      key_index: 0
  - name: fav_stock_hash
    op_type: FeatureHash
    inputs:
      - fav_stock_codes
    outputs:
      - fav_stock_ids
    params:
      vocab_size: 1000
      num_hashes: 1
    embed:
      vocab_size: 1000
      embed_dim: 8
      pooling: flatten
      seq_len: 8
  - name: interest_kw_parse
    op_type: StringParser
    inputs:
      - interest_keywords
    outputs:
      - interest_kw_list
    params:
      sep1: "|"
      sep2: "#"
      key_index: 0
      pad_len: 8
      pad_val: ""
  - name: interest_kw_hash
    op_type: FeatureHash
    inputs:
      - interest_kw_list
    outputs:
      - interest_kw_ids
    params:
      vocab_size: 1000
      num_hashes: 1
    embed:
      vocab_size: 1000
      embed_dim: 8
      pooling: flatten
      seq_len: 8
  - name: follow_authors_parse
    op_type: StringParser
    inputs:
      - follow_authors
