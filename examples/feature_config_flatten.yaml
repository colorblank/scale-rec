      num_hashes: 1
    embed:
      vocab_size: 1000
      embed_dim: 8
      pooling: flatten
      seq_len: 8
  - name: hist_items_parse
    op_type: StringParser
    inputs:
      - historical_click_items
    outputs:
      - hist_vectors
    params:
      sep1: "|"
      sep2: "#"
      key_index: 0
      pad_len: 5
      pad_val: ""
  - name: hist_semantic_flat
    op_type: FlatSplit
    inputs:
      - hist_vectors
    outputs:
      - hist_semantic_ids
    params:
      sep: ","
      max_len: 20
      pad_val: ""
  - name: hist_semantic_hash
    op_type: FeatureHash
    inputs:
      - hist_semantic_ids
    outputs:
      - hist_semantic_mapped
    params:
      vocab_size: 5000
      num_hashes: 1
    embed:
      vocab_size: 5000
      embed_dim: 8
      pooling: flatten
      seq_len: 20
  # ── Cross Features ──
  - name: user_author_concat
    op_type: StringConcat
    inputs:
      - user_id
      - author_id
    outputs:
      - user_author_str
    params:
      separator: _
  - name: user_author_hash
    op_type: FeatureHash
    inputs:
      - user_author_str
    outputs:
      - user_author_hash_idx
    params:
      vocab_size: 10000
      num_hashes: 1
    embed:
      vocab_size: 10000
      embed_dim: 8
  - name: type_source_concat
    op_type: StringConcat
    inputs:
      - item_type
      - source_name
    outputs:
      - type_source_str
    params:
      separator: _
  - name: type_source_hash
    op_type: FeatureHash
    inputs:
      - type_source_str
    outputs:
      - type_source_hash_idx
    params:
      vocab_size: 100
      num_hashes: 1
    embed:
      vocab_size: 100
      embed_dim: 8
  # ── Overlap Features ──
  - name: entity_overlap
    op_type: ListOverlap
    inputs:
      - entities_v3_list
      - hist_semantic_ids
    outputs:
      - entity_overlap_flag
