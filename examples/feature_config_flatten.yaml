      sep2: "#"
      key_index: 0
      pad_len: 5
      pad_val: ""
  - name: follow_authors_hash
    op_type: FeatureHash
    inputs:
      - follow_authors_list
    outputs:
      - follow_authors_ids
    params:
      vocab_size: 1000
      num_hashes: 1
    embed:
      vocab_size: 1000
      embed_dim: 8
      pooling: flatten
      seq_len: 5
  - name: hold_stocks_parse
