      num_hashes: 1
    embed:
      vocab_size: 100
      embed_dim: 8
      pooling: flatten
      seq_len: 3
  - name: theme_interest_parse
    op_type: StringParser
    inputs:
      - theme_interest
    outputs:
      - theme_interest_list
    params:
      sep1: "|"
      sep2: "#"
      key_index: 0
      pad_len: 5
      pad_val: ""
  - name: theme_interest_hash
    op_type: FeatureHash
    inputs:
      - theme_interest_list
    outputs:
      - theme_interest_ids
    params:
      vocab_size: 200
      num_hashes: 1
    embed:
      vocab_size: 200
      embed_dim: 8
      pooling: flatten
      seq_len: 5
  - name: industry_interest_parse
    op_type: StringParser
    inputs:
      - industry_interest
    outputs:
      - industry_interest_list
    params:
      sep1: "|"
      sep2: "#"
      key_index: 0
      pad_len: 5
