version: "1.0.0"

sources:
  - name: "user_id"
    source: "User"
    dtype: "int"
    default_val: "0"
    embed:
      vocab_size: 200
      embed_dim: 8

  - name: "user_age"
    source: "User"
    dtype: "float"
    default_val: "0.0"

  - name: "item_category"
    source: "Item"
    dtype: "string"
    default_val: "unknown"

  - name: "user_tags"
    source: "User"
    dtype: "string"
    default_val: ""

  - name: "item_tags"
    source: "Item"
    dtype: "string"
    default_val: ""

  - name: "item_price"
    source: "Item"
    dtype: "float"
    default_val: "1.0"

operators:
  - name: "age_bucket_op"
    op_type: "Bucketing"
    inputs: ["user_age"]
    outputs: ["user_age_bucket"]
    params:
      boundaries: [18, 25, 35, 50]
    embed:
      vocab_size: 5
      embed_dim: 4

  - name: "category_map_op"
    op_type: "DictMapper"
    inputs: ["item_category"]
    outputs: ["item_category_idx"]
    params:
      mapping:
        electronics: 1
        fashion: 2
        books: 3
      default_idx: 0
    embed:
      vocab_size: 4
      embed_dim: 4

  # StringParser → DictMapper chaining: parse user_tags, map to indices
  - name: "user_tag_parser_op"
    op_type: "StringParser"
    inputs: ["user_tags"]
    outputs: ["user_tag_list"]
    params:
      sep1: "|"
      sep2: "#"
      key_index: 0
      pad_len: 1
      pad_val: "none"

  - name: "user_tag_map_op"
    op_type: "DictMapper"
    inputs: ["user_tag_list"]
    outputs: ["user_tag_idx"]
    params:
      mapping:
        sports: 1
        music: 2
        gaming: 3
        reading: 4
        travel: 5
      default_idx: 0
    embed:
      vocab_size: 6
      embed_dim: 4

  # ListOverlap: check tag overlap between user and item
  - name: "item_tag_parser_op"
    op_type: "StringParser"
    inputs: ["item_tags"]
    outputs: ["item_tag_list"]
    params:
      sep1: "|"
      sep2: "#"
      key_index: 0
      pad_len: 5
      pad_val: "none"

  - name: "tag_overlap_op"
    op_type: "ListOverlap"
    inputs: ["user_tag_list", "item_tag_list"]
    outputs: ["tag_overlap_flag"]
    params: {}

