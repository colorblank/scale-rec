[project]
name = "train"
version = "0.1.0"
description = "Python training pipeline for scale-rec"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "packaging>=23.0",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "torch>=2.1",
]

[project.scripts]
train = "train.main:main"
scale-rec-demo-data = "scale_rec_demo.generate_data:main"
scale-rec-demo-discover-data = "scale_rec_demo.generate_discover_data:main"
scale-rec-demo-train-all = "scale_rec_demo.train_all:main"
scale-rec-demo-train-discover = "scale_rec_demo.train_discover:main"
scale-rec-demo-verify = "scale_rec_demo.verify_all:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
