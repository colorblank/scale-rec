[project]
name = "train"
version = "0.1.0"
description = "Python training pipeline for scale-rec"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "packaging>=23.0",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "torch>=2.1",
]

[project.scripts]
train = "train.app.main:main"
scale-rec-demo-data = "scale_rec_demo.generate_demo_data:main"
scale-rec-demo-verify = "scale_rec_demo.verify_all:main"
scale-rec-demo-verify-all = "scale_rec_demo.verify_all:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "C4", "DTZ", "ERA", "I", "PERF", "PIE", "PT", "PTH", "RUF", "SIM", "TRY", "UP"]
ignore = ["E402", "E501", "TRY003", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
files = "$MYPY_CONFIG_FILE_DIR/src/train"

[[tool.mypy.overrides]]
module = [
    "train.app.cli",
    "train.app.artifacts",
    "train.app.data",
    "train.app.main",
    "train.app.manifest",
    "train.core.config",
    "train.core.dag",
    "train.core.schema",
    "train.core.task",
    "train.layers.towers",
    "train.models",
    "train.models.unimixer.model",
    "train.ops.expression",
    "train.ops.feature_hash",
    "train.training.eval.evaluator",
    "train.training.loss.multi_task",
    "train.training.metrics",
    "train.training.optim.scheduler",
    "train.training.quality",
    "train.training.trainer",
]
ignore_errors = true
