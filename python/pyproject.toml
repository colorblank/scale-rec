[project]
name = "train"
version = "0.1.0"
description = "Python training pipeline for scale-rec"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.4",
    "packaging>=26.2",
    "polars>=1.40.1",
    "pyyaml>=6.0.3",
    "safetensors>=0.7.0",
    "torch>=2.11.0",
]

[project.scripts]
train = "train.main:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
