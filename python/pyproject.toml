[project]
name = "train"
version = "0.1.0"
description = "Python training pipeline for scale-rec"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.4",
    "packaging>=26.2",
    "pandas>=2.3.0",
    "pyyaml>=6.0.3",
    "safetensors>=0.7.0",
    "torch>=2.11.0",
]

[project.scripts]
train = "train.main:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
